<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nokosocial - Responsive social media website</title>
  <!-- Stylesheet -->
  <link rel="stylesheet" href="./style.css">
  <!-- Icons CDN -->
  <script src="https://kit.fontawesome.com/5632ce05bc.js" crossorigin="anonymous"></script>
</head>
<body>
  <nav>
    <div class="container">
      <h2 class="logo">Nokosocial</h2>
      <div class="search-bar">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="search" placeholder="Search for creators, inspiration and projects" />
      </div>
      <div class="create">
        <label for="create-post">Create</label>
        <div class="profile-picture">
          <img src="./images/users/user-1.jpg" alt="Jack Morgan" />
        </div>
      </div>
    </div>
  </nav>
</body>
</html>
